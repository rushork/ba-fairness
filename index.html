<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bolt Action Terrain Fairness Tool</title>
  <link rel="stylesheet" href="style.css">
</head>

<body id="background">

  <div id="app">
    <header id="app-header"><h1>BA Terrain Fairness</h1></header>

    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
      <h3>Description</h3>
      <p>
        Welcome to the BA Terrain Fairness Tool!
        <br><br>
        Use this tool to figure out the fairness of your Bolt Action maps.
      </p>

      <hr>

      <h3>Terrain</h3>

      <button id="resetWeights">Reset Weights</button>
      <br><br>

      <button data-type="hard">Hard Terrain</button>
      <div class="weight-slider">
        <label>Hard: <span id="hardVal">3</span></label>
        <input type="range" min="0" max="5" step="0.1" value="3" id="hardSlider">
      </div>

      <button data-type="light">Light Terrain</button>
      <div class="weight-slider">
        <label>Light: <span id="lightVal">1</span></label>
        <input type="range" min="0" max="5" step="0.1" value="1" id="lightSlider">
      </div>
    </div>

    <!-- BOARD -->
    <div id="board">
      <div id="divider"></div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div id="sidebar">
      <h3>Map Dimensions</h3>
      <hr>
      
      <div class="dimension-input">
        <label>Width (feet):</label>
        <input type="number" id="mapWidth" value="6" min="1" step="0.5">
      </div>
      
      <div class="dimension-input">
        <label>Height (feet):</label>
        <input type="number" id="mapHeight" value="4" min="1" step="0.5">
      </div>
      
      <button id="updateMapSize">Update Map</button>

      <hr>
      
      <h3>Deployment Zones</h3>
      <div class="deployment-mode">
        <label><input type="radio" name="deployMode" value="longEdges" checked> Long Edges</label>
        <label><input type="radio" name="deployMode" value="quarters"> Quarters</label>
      </div>

      <hr>
      <hr>

      <div id="score">
        <p><b>Blue:</b> 0.00</p>
        <p><b>Red:</b> 0.00</p>
        <p><b>Verdict:</b> Balanced</p>
      </div>

      <hr>

      <!-- score already above -->
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

  </div>

  <script src="script.js"></script>
</body>
</html>
