<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bolt Action Terrain Fairness Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="background">

  <div id="app">
    <div id="sidebar">
      <h3>Description</h3>
      <p>
        Welcome to the BA Terrain Fairness Tool!

        <br><br>

        Use this tool in order to figure out the fairness of your maps for Bolt Action. 

      </p>
      <hr>

      <h3>Terrain </h3> 
      
      <button id="resetWeights">Reset Weights</button>
      <br><br>

      <button data-type="building">Building (Hard)</button>
      <div class="weight-slider">
        <label>Building: <span id="buildingVal">3</span></label>
        <input type="range" min="0" max="5" step="0.1" value="3" id="buildingSlider">
      </div>

      <button data-type="forest">Forest (Soft)</button>
      <div class="weight-slider">
        <label>Forest: <span id="forestVal">1</span></label>
        <input type="range" min="0" max="5" step="0.1" value="1" id="forestSlider">
      </div>

      <button data-type="hill">Hill (Soft)</button>
      <div class="weight-slider">
        <label>Hill: <span id="hillVal">1</span></label>
        <input type="range" min="0" max="5" step="0.1" value="1" id="hillSlider">
      </div>

      <button data-type="hedge">Hedgerow (Soft)</button>
      <div class="weight-slider">
        <label>Hedgerow: <span id="hedgeVal">1</span></label>
        <input type="range" min="0" max="5" step="0.1" value="1" id="hedgeSlider">
      </div>
      <button data-type="bocage">Bocage (Hard)</button>
      <div class="weight-slider">
        <label>Bocage: <span id="bocageVal">2</span></label>
        <input type="range" min="0" max="5" step="0.1" value="2" id="bocageSlider">
      </div>
    </div>

    <div id="board">
      <div id="divider"></div>
    </div>

    <div id="sidebar">
      <h3>Balance</h3>
      <hr>
      <div id="score">
        <p><b>North:</b> 0.00</p>
      <p><b>South:</b> 0.00</p>
      <p><b>Verdict:</b> Balanced</p>
      </div>
      <br>
      <hr>
      <h3>Key-binds:</h3> 
        R = Rotate
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
